[project]
name = "eltbench-tinker-env"
version = "0.1.0"
description = "A verifiable ELT-Bench environment adapter for Tinker RL"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4.0", "pyyaml>=6.0", "pandas>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
tinker = ["tinker-cookbook"]
snowflake = ["snowflake-connector-python>=3.12"]

[project.scripts]
eltbench-tinker-train = "eltbench_tinker.train:main"
eltbench-run = "eltbench_tinker.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eltbench_tinker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
