[project]
name = "eltbench-tinker-env"
version = "0.1.0"
description = "A verifiable ELT-Bench environment adapter for Tinker RL"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4.0", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
tinker = ["tinker-cookbook"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eltbench_tinker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
